<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>打击乐社｜招新网站</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;}
        body {font-family: "Microsoft Yahei",sans-serif;line-height: 1.7;background-color: #1a1a1a;color: #fff;}
        header {background: #c41e3a;padding: 25px;text-align: center;}
        nav {background: #2b2b2b;padding:15px;text-align:center;position:sticky;top:0;z-index:99;}
        nav a {color:#ffd700;text-decoration:none;margin:0 18px;font-size:18px;}
        nav a:hover {color:#fff;}
        section {width:80%;margin:40px auto;padding:25px;background:#282828;border-radius:10px;}
        h2 {color:#ffd700;margin-bottom:16px;border-left:4px solid #c41e3a;padding-left:10px;}
        table {width:100%;border-collapse:collapse;margin:20px 0;}
        table th,table td {border:1px solid #555;padding:12px;text-align:center;}
        th {background:#c41e3a;}
        input,textarea,button {width:100%;padding:10px;margin:8px 0;border-radius:5px;border:none;font-size:16px;}
        button {background:#c41e3a;color:#fff;cursor:pointer;font-weight:bold;}
        video {width:100%;border-radius:8px;margin:15px 0;}
        footer {text-align:center;padding:20px;background:#111;margin-top:40px;color:#aaa;}
    </style>
</head>
<body>
    <!-- 背景音乐 -->
    <audio autoplay loop controls>
        <source src="bgm.mp3" type="audio/mpeg">
        你的浏览器不支持音频播放
    

    <header>
        <h1>🔥 打击乐社 招新 🔥</h1>
        <p>鼓点不息，节奏为王！</p>
    </header>

    <!-- 锚点导航 -->
    <nav>
        <a href="#intro">社团简介</a>
        <a href="#activity">活动安排</a>
        <a href="#video">演出视频</a>
        <a href="#join">报名表单</a>
        <a href="about.html">关于我们</a>
    </nav>

    <!-- 锚点1：社团简介 -->
    <section id="intro">
        <h2>社团简介</h2>
        <p>打击乐社汇聚热爱节奏的同学，包含架子鼓、小军鼓、卡洪鼓、邦戈鼓、铃鼓等多种打击乐器。
        无论你是零基础小白，还是有演奏基础，都可以加入我们。日常有基础教学、合奏排练、晚会演出、校园快闪等活动。
        感受节拍的力量，一起用鼓点点燃舞台！</p>
    </section>

    <!-- 锚点2：活动表格 -->
    <section id="activity">
        <h2>日常活动安排表</h2>
        <table>
            <tr>
                <th>时间</th>
                <th>活动内容</th>
                <th>地点</th>
            </tr>
            <tr>
                <td>每周二晚</td>
                <td>零基础基础教学</td>
                <td>音乐活动室</td>
            </tr>
            <tr>
                <td>每周四晚</td>
                <td>合奏排练、曲目打磨</td>
                <td>音乐活动室</td>
            </tr>
            <tr>
                <td>每月月末</td>
                <td>内部小展演</td>
                <td>大学生活动中心</td>
            </tr>
        </table>
    </section>

    <!-- 锚点3：视频嵌入 -->
    <section id="video">
        <h2>社团演出视频</h2>
        <video controls>
            <source src="show.mp4" type="video/mp4">
            浏览器不支持视频播放
        </video>
        <p>往期晚会架子鼓合奏现场</p>
    </section>

    <!-- 锚点4：报名表单 -->
    <section id="join">
        <h2>招新报名</h2>
        <form>
            <label>姓名</label>
            <input type="text" placeholder="请输入姓名">
            <label>学号</label>
            <input type="text" placeholder="请输入学号">
            <label>联系方式</label>
            <input type="tel" placeholder="手机号">
            <label>有无打击乐基础</label>
            <input type="text" placeholder="零基础/会架子鼓/会其他打击乐器">
            <label>想说的话</label>
            <textarea rows="4" placeholder="为什么想加入打击乐社"></textarea>
            <button type="submit">提交报名</button>
        </form>
    </section>

    <footer>
        <p>打击乐社 © 2026 网页作业</p>
    </footer>
</body>
</html>
