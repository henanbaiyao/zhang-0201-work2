        <h2>社团历史</h2>
        <p>打击乐社成立以来，不断吸纳喜欢节奏、热爱鼓乐的同学。我们不追求人人技术高超，重在享受节奏、享受合奏的快乐。</p>
        <h2>社团理念</h2>
        <p>以鼓会友，随乐同行。包容零基础，鼓励大胆上台，在一次次排练和演出中共同进步。</p>
        <h2>可以学习的乐器</h2>
        <p>架子鼓、小军鼓、卡洪鼓、铃鼓、木鱼、沙锤、邦戈鼓等各类打击乐器。</p>
